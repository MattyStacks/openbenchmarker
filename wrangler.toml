# Cloudflare Workers Static Assets (same setup as opengpubenchmarks.com).
name = "openbenchmarker"
compatibility_date = "2026-10-01"

# Custom domain: wrangler deploy creates the DNS record and certificate.
routes = [{ pattern = "opengpubenchmarker.com", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
